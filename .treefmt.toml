[formatter.nix]
command = "nixpkgs-fmt"
includes = ["*.nix"]

[formatter.buildifier]
command = "buildifier"
includes = ["*.bazel", "*.bzl"]

[formatter.clang-format]
command = "./tools/clang-format.sh"
includes = [".cpp", ".c", ".h", ".hpp"]

[formatter.prettier]
command = "prettier"
options = ["--write"]
includes = [
 "*.css",
 "*.html",
 "*.js",
 "*.json",
 "*.jsx",
 "*.md",
 "*.mdx",
 "*.scss",
 "*.ts",
 "*.yaml",
]

# Shellcheck also lints files in it's default configuration.
# Once we have linting through other means (aspect rules lint), it might be worth it to change the args here.
[formatter.shellcheck]
command = "shellcheck"
includes = ["*.sh", "*.bash", "*.envrc", "*.envrc.*"]
