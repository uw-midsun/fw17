[formatter.nix]
command = "nixpkgs-fmt"
includes = ["*.nix"]

[formatter.buildifier]
command = "buildifier"
includes = ["*.bazel", "*.bzl"]

[formatter.clang-format]
command = "./tools/clang-format"
includes = [".cpp", ".c", ".h", ".hpp"]

[formatter.prettier]
command = "prettier"
options = ["--write"]
includes = [
 "*.css",
 "*.html",
 "*.js",
 "*.json",
 "*.jsx",
 "*.md",
 "*.mdx",
 "*.scss",
 "*.ts",
 "*.yaml",
]